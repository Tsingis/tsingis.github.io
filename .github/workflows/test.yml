name: test
on:
  pull_request:
    branches:
      - main
    paths:
      - "util/*.py"
      - "util/requirements.txt"
      - ".github/workflows/test.yml"
  workflow_dispatch:
jobs:
  util-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: pip install --prefer-binary -r util/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s util -v
