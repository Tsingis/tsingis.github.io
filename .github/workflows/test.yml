name: test
on:
  pull_request:
    branches:
      - main
    paths:
      - "util/*.py"
      - "util/requirements.txt"
      - ".github/workflows/test.yml"
  workflow_dispatch:
jobs:
  util-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install --prefer-binary -r util/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s util -v
