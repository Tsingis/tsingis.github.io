name: playwright
on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/package*.json"
      - "tests/**/*.spec.ts"
      - ".github/workflows/playwright.yml"
  workflow_dispatch:
    inputs:
      baseUrl:
        description: "Base URL for tests"
        required: true
        type: choice
        options:
          - "local"
          - "remote"
        default: "local"
  schedule:
    - cron: "0 21 1 * *"
env:
  NO_UPDATE_NOTIFIER: true
jobs:
  playwright:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      BASE_URL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.baseUrl || 'local' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: "tests/package-lock.json"
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: ./tests
      - name: Cache playwright
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/package-lock.json') }}
      - name: Typecheck
        run: npm run typecheck
        working-directory: ./tests
      - name: Setup
        run: npm run playwright:setup
        working-directory: ./tests
      - name: Run tests (local)
        if: ${{ env.BASE_URL_MODE == 'local' }}
        run: npm run playwright
        working-directory: ./tests
        env:
          CI: true
      - name: Run tests (remote)
        if: ${{ env.BASE_URL_MODE == 'remote' }}
        run: npm run playwright
        working-directory: ./tests
        env:
          CI: true
          BASE_URL: ${{ vars.URL }}
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: tests/test-results/
          retention-days: 14
